name: Build My Flow APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Complete App & Compile APK
        run: |
          mkdir -p app/src/main/java/com/flow/auto
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FlowAutomator"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.flow.auto'
              compileSdk 34
              defaultConfig {
                  applicationId "com.flow.auto"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Flow AI Auto"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0F172A">

              <LinearLayout
                  android:id="@+id/controlPanel"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="10dp"
                  android:background="#1E293B">

                  <EditText
                      android:id="@+id/promptBox"
                      android:layout_width="match_parent"
                      android:layout_height="68dp"
                      android:hint="यहाँ सारे Prompts पेस्ट करें (एक लाइन में एक Prompt)..."
                      android:textColor="#FFFFFF"
                      android:textColorHint="#94A3B8"
                      android:textSize="12sp"
                      android:background="#0F172A"
                      android:padding="8dp"
                      android:gravity="top|start"
                      android:inputType="textMultiLine" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginTop="6dp">
                      <Spinner
                          android:id="@+id/imgSpinner"
                          android:layout_width="0dp"
                          android:layout_height="36dp"
                          android:layout_weight="1"
                          android:background="#334155" />
                      <View android:layout_width="6dp" android:layout_height="1dp" />
                      <Spinner
                          android:id="@+id/vidSpinner"
                          android:layout_width="0dp"
                          android:layout_height="36dp"
                          android:layout_weight="1"
                          android:background="#334155" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:layout_marginTop="6dp">
                      <Button
                          android:id="@+id/btnFile"
                          android:layout_width="wrap_content"
                          android:layout_height="38dp"
                          android:text="Import .txt"
                          android:textSize="11sp"
                          android:backgroundTint="#3B82F6"
                          android:textColor="#FFFFFF" />
                      <Button
                          android:id="@+id/btnStart"
                          android:layout_width="wrap_content"
                          android:layout_height="38dp"
                          android:text="▶ Start Loop"
                          android:textSize="11sp"
                          android:layout_marginStart="6dp"
                          android:backgroundTint="#10B981"
                          android:textColor="#FFFFFF" />
                      <Button
                          android:id="@+id/btnStop"
                          android:layout_width="55dp"
                          android:layout_height="38dp"
                          android:text="■"
                          android:textSize="11sp"
                          android:layout_marginStart="6dp"
                          android:backgroundTint="#EF4444"
                          android:textColor="#FFFFFF" />
                      <TextView
                          android:id="@+id/txtStatus"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:layout_marginStart="8dp"
                          android:text="1. नीचे Google Login करें"
                          android:textColor="#38BDF8"
                          android:textSize="11sp" />
                  </LinearLayout>
              </LinearLayout>

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/flow/auto/MainActivity.kt
          package com.flow.auto

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.webkit.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.io.BufferedReader
          import java.io.InputStreamReader

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private lateinit var promptBox: EditText
              private lateinit var imgSpinner: Spinner
              private lateinit var vidSpinner: Spinner
              private lateinit var txtStatus: TextView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)
                  promptBox = findViewById(R.id.promptBox)
                  imgSpinner = findViewById(R.id.imgSpinner)
                  vidSpinner = findViewById(R.id.vidSpinner)
                  txtStatus = findViewById(R.id.txtStatus)

                  val imgModels = arrayOf("Imagen 3", "Imagen 3 Fast")
                  val vidModels = arrayOf("Veo 2", "Veo 2 Fast")
                  imgSpinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, imgModels)
                  vidSpinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, vidModels)

                  val ws = webView.settings
                  ws.javaScriptEnabled = true
                  ws.domStorageEnabled = true
                  ws.databaseEnabled = true
                  ws.mediaPlaybackRequiresUserGesture = false
                  ws.userAgentString = "Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)
                  webView.webViewClient = WebViewClient()

                  webView.setDownloadListener { url, ua, _, mime, _ ->
                      if (url.startsWith("http")) {
                          val req = DownloadManager.Request(Uri.parse(url))
                          req.setMimeType(mime)
                          req.addRequestHeader("cookie", CookieManager.getInstance().getCookie(url))
                          req.addRequestHeader("User-Agent", ua)
                          req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                          val ext = if (mime.contains("video")) ".mp4" else ".png"
                          req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "FlowAI_${System.currentTimeMillis()}$ext")
                          (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(req)
                          Toast.makeText(this, "Downloading Media...", Toast.LENGTH_SHORT).show()
                      }
                  }

                  webView.addJavascriptInterface(object {
                      @JavascriptInterface
                      fun status(msg: String) {
                          runOnUiThread { txtStatus.text = msg }
                      }
                  }, "Bridge")

                  webView.loadUrl("https://labs.google/fx/tools/flow")

                  findViewById<Button>(R.id.btnFile).setOnClickListener {
                      val intent = Intent(Intent.ACTION_GET_CONTENT).apply { type = "text/plain" }
                      startActivityForResult(intent, 101)
                  }

                  findViewById<Button>(R.id.btnStart).setOnClickListener { startLoop() }
                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      webView.evaluateJavascript("window.stopFlow=true;", null)
                      txtStatus.text = "Stopped."
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 101 && resultCode == Activity.RESULT_OK) {
                      data?.data?.let { uri ->
                          val text = contentResolver.openInputStream(uri)?.use {
                              BufferedReader(InputStreamReader(it)).readText()
                          } ?: ""
                          promptBox.setText(text)
                          Toast.makeText(this, "Prompts Imported!", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun startLoop() {
                  val lines = promptBox.text.toString().split("\n").map { it.trim() }.filter { it.isNotEmpty() }
                  if (lines.isEmpty()) {
                      Toast.makeText(this, "पहले Prompts डालें या Import करें!", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val jsonList = lines.joinToString(prefix = "[", postfix = "]") { "\"${it.replace("\"", "\\\"")}\"" }
                  val im = imgSpinner.selectedItem.toString()
                  val vm = vidSpinner.selectedItem.toString()

                  val js = """
                      (async function(){
                          window.stopFlow = false;
                          const list = $jsonList;
                          const imgM = "$im";
                          const vidM = "$vm";
                          const wait = ms => new Promise(r => setTimeout(r, ms));
                          function clickBtn(txt) {
                              const el = Array.from(document.querySelectorAll('button, div[role="button"], a')).find(e => e.innerText && e.innerText.toLowerCase().includes(txt.toLowerCase()) && !e.disabled);
                              if(el){ el.click(); return true; }
                              return false;
                          }
                          for(let i=0; i<list.length; i++){
                              if(window.stopFlow) break;
                              Bridge.status("Prompt " + (i+1) + "/" + list.length + ": Image...");
                              clickBtn(imgM);
                              await wait(1000);
                              const box = document.querySelector('textarea, [contenteditable="true"], input[type="text"]');
                              if(!box){ Bridge.status("Error: पहले Flow में Login करके प्रोजेक्ट खोलें!"); break; }
                              box.focus();
                              if(box.getAttribute('contenteditable')==='true'){
                                  box.innerText = list[i];
                              } else {
                                  const s = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value')?.set;
                                  s ? s.call(box, list[i]) : (box.value = list[i]);
                              }
                              box.dispatchEvent(new Event('input', {bubbles:true}));
                              await wait(1200);
                              if(!clickBtn('Generate') && !clickBtn('Create')){
                                  box.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter', keyCode:13, bubbles:true}));
                              }
                              await wait(24000);
                              if(window.stopFlow) break;
                              clickBtn('Download');
                              await wait(2000);
                              Bridge.status("Prompt " + (i+1) + "/" + list.length + ": Animating...");
                              clickBtn(vidM);
                              await wait(1000);
                              clickBtn('Animate');
                              await wait(1500);
                              clickBtn('Generate');
                              await wait(45000);
                              if(window.stopFlow) break;
                              clickBtn('Download');
                              await wait(3000);
                          }
                          if(!window.stopFlow) Bridge.status("All Completed!");
                      })();
                  """.trimIndent()
                  webView.evaluateJavascript(js, null)
              }
          }
          EOF

          gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Auto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
